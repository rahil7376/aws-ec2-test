; Copy into the PHP-FPM conf.d directory for this Ubuntu version, then restart it.
; Example: /etc/php/8.3/fpm/conf.d/99-stateless.ini
;
; auto_start must stay off, or PHP will save logins as files on this instance
; before the application can attach its MySQL session handler.

session.auto_start = 0
upload_max_filesize = 8M
post_max_size = 8M
