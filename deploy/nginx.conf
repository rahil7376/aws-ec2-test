# Nginx site for Ubuntu.
# Install with the steps in README.md. The socket must match the PHP
# version on the instance, for example /run/php/php8.3-fpm.sock.
# Confirm with: ls /run/php

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/stateless/public;
    index index.php;

    client_max_body_size 8m;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }

    location ~ /\. {
        deny all;
    }
}
